name: SafeDDL Lock Contention Check

on:
  pull_request:
    paths:
      - 'migrations/**'
      - 'db/migrations/**'
      - 'prisma/migrations/**'

jobs:
  audit-migrations:
    name: Audit DDL for Table Locks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run SafeDDL Check
        run: |
          npx safeddl --check migrations/*.sql
